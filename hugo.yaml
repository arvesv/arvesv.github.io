baseURL: https://arvesv.com/
title: Arve's Playground
theme: PaperMod
enableGitInfo: true

copyright: "© 2026 Arve Svendsen. All rights reserved."

params:
  author: Arve Svendsen
  description: "Software developer sharing thoughts"
  keywords: ["software development", "DevOps", "Security", "AI"]

  # Favicon
  assets:
    favicon: "/favicon.ico"
    favicon16x16: "/favicon.ico"
    favicon32x32: "/favicon.ico"
    apple_touch_icon: "/apple-touch-icon.png"
    safari_pinned_tab: "/favicon.svg"

  # PaperMod specific
  ShowReadingTime: false
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true

  # Social links
  social:
    - name: GitHub
      url: https://github.com/arvesv
    - name: X
      url: https://x.com/arvesv
    - name: LinkedIn
      url: https://linkedin.com/in/arvesv

menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 10
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 20
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 30
    - identifier: about
      name: About
      url: /about
      weight: 40

markup:
  highlight:
    style: github
    lineNos: true
    codeFences: true
