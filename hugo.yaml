baseURL: https://arvesv.com/
title: Arve's Playground
theme: PaperMod
enableGitInfo: true
enableRobotsTXT: true

copyright: "© 2026 Arve Svendsen. All rights reserved."

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  author: Arve Svendsen
  description: "Software developer sharing thoughts"
  keywords: ["software development", "DevOps", "Security", "AI"]
  images: ["/apple-touch-icon.png"]

  # Favicon
  assets:
    favicon: "/favicon.ico"
    favicon16x16: "/favicon.ico"
    favicon32x32: "/favicon.ico"
    apple_touch_icon: "/apple-touch-icon.png"
    safari_pinned_tab: "/favicon.svg"

  # PaperMod specific
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  ShowFullTextinRSS: true

  # Home intro card
  homeInfoParams:
    Title: "Hi, I'm Arve 👋"
    Content: "Software developer sharing thoughts on DevOps, Cloud, AI, and homelab."

  # Social links
  social:
    - name: GitHub
      url: https://github.com/arvesv
    - name: X
      url: https://x.com/arvesv
    - name: LinkedIn
      url: https://linkedin.com/in/arvesv

menu:
  main:
    - identifier: search
      name: Search
      url: /search/
      weight: 10
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 20
    - identifier: archives
      name: Archive
      url: /archives/
      weight: 30
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 40
    - identifier: about
      name: About
      url: /about
      weight: 50

markup:
  highlight:
    style: github
    lineNos: false
    codeFences: true
